# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

dotenv:
  - .env.example
  - .env

tasks:
  frontend:
    desc: Build React frontend into internal/web/dist
    cmds:
      - npm --prefix frontend run build

  proto:
    desc: Generate Go and TypeScript ConnectRPC code from proto definitions
    cmds:
      - protoc -I proto --go_out=internal/gen --go_opt=paths=source_relative --connect-go_out=internal/gen --connect-go_opt=paths=source_relative proto/bigflix/v1/bigflix.proto
      - protoc -I proto --es_out=frontend/src/gen --es_opt=target=ts proto/bigflix/v1/bigflix.proto

  run:
    desc: Build frontend and run Bigflix server
    deps:
      - frontend
    cmds:
      - go run ./cmd/bigflix
    silent: true
